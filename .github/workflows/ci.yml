name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Without a database the migration, boot and cross-schema-grant tests skip
    # themselves, so the suite would pass while covering none of them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
          POSTGRES_DB: fliks
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      FK_TEST_PG_DSN: postgresql://fliks:fliks@127.0.0.1:55432/fliks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Stand-ins for the core tables this plugin holds `REFERENCES` grants on:
      # the grant tests need the target to exist, not core's real shape. `media`
      # also carries the two columns the tests insert into.
      - name: Create core reference stubs
        run: |
          psql "$FK_TEST_PG_DSN" -c 'CREATE TABLE IF NOT EXISTS public."media" (id serial PRIMARY KEY, "title" text NOT NULL DEFAULT '"'"''"'"', "type" text NOT NULL DEFAULT '"'"'movie'"'"');'
          for t in episodes seasons users; do
            psql "$FK_TEST_PG_DSN" -c "CREATE TABLE IF NOT EXISTS public.\"$t\" (id serial PRIMARY KEY);"
          done
      # The manifest's `fliks` range is checked against the core release this plugin targets.
      # Failing to resolve it fails the job: a green run on a guessed version publishes an archive
      # that a real core refuses.
      - name: Resolve the core version to check the manifest against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh release view --repo fliks-app/fliks --json tagName -q .tagName | sed 's/^v//')
          [ -n "$v" ] || { echo "::error::could not resolve the latest fliks release"; exit 1; }
          echo "FLIKS_CORE_VERSION=$v" >> "$GITHUB_ENV"
          echo "checking the manifest against fliks $v"
      - run: npm test
      - run: npm run build
      - run: node --check dist/plugin.js

  package:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
        env:
          FK_DOWNLOAD_SIGNING_KEY: ${{ secrets.FK_DOWNLOAD_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fliks-download.fkplugin
          path: dist/fliks-download.fkplugin
