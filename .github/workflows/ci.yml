name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Under CI the harness fails instead of skipping when this is missing.
      FLIKS_HARNESS_PG_URL: postgresql://fliks:fliks@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
      # The component tests load the release component.
      - run: cargo build --release --target wasm32-wasip2
      - run: cargo test --workspace
      - name: Verify the component and its archive (world, archive guard, 12 MiB budget)
        run: cargo xtask package --max-mib 12 --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugin.wasm
          path: target/wasm32-wasip2/release/fk_plugin_download.wasm

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: plugin.wasm
      - name: Build plugin.json and publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fk-plugin-download") | .version')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG is not v$version"; exit 1; }
          mv fk_plugin_download.wasm plugin.wasm
          jq --arg v "$version" \
             --arg wasm "$(sha256sum plugin.wasm | cut -d' ' -f1)" \
             --arg logo "$(sha256sum logo.svg | cut -d' ' -f1)" \
             '. + {version: $v, files: {"plugin.wasm": $wasm, "logo.svg": $logo}}' \
             plugin.template.json > plugin.json
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            plugin.json plugin.wasm logo.svg
